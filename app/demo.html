<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAF Agent Studio</title><style> *{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17283d;font:16px system-ui}header{background:#142b45;color:white;padding:24px max(24px,calc((100vw - 1000px)/2))}main{max-width:1000px;margin:28px auto;padding:0 20px}section{background:white;border:1px solid #dce4ee;border-radius:14px;padding:24px;margin:16px 0}label{display:block;font-weight:600;margin:14px 0 6px}textarea,select{width:100%;padding:12px;border:1px solid #a8b9cb;border-radius:8px;font:inherit}button{background:#175bc2;color:white;border:0;border-radius:8px;padding:12px 22px;font:inherit;margin-top:16px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}small{color:#51677e}a{color:inherit}h1{margin:0} </style><header><small style="color:#b9d4ee">VAF OPEN SOURCE / 01</small><h1>AI Agent Studio</h1><p>Research, document evidence and human-reviewed task planning.</p></header><main><section><label for="mode">Agent</label><select id="mode"><option value="research">Research</option><option value="document">Document Q&A</option><option value="task">Task planner</option></select><label for="provider">Model provider</label><select id="provider"><option value="demo">Local demo (no key)</option><option value="openai">OpenAI (server opt-in)</option><option value="gemini">Google Gemini (server opt-in)</option><option value="ollama">Ollama (server opt-in)</option></select><label for="question">Your question</label><textarea id="question" rows="3" maxlength="2000">What are the steps for legacy migration?</textarea><label for="evidence">Optional document text (up to 12,000 characters)</label><textarea id="evidence" rows="4" maxlength="12000" placeholder="Leave blank to use fictional sample data"></textarea><small>External providers may receive your input. Do not submit confidential data.</small><br><button id="run">Run agent</button></section><section aria-live="polite"><h2>Agent output</h2><pre id="out">Ready to run.</pre></section><footer><a href="/docs">API documentation</a> · <a href="https://vaf.ai/">VAF</a></footer></main><script>const $=id=>document.getElementById(id);$('run').onclick=async()=>{ $('run').disabled=true;$('out').textContent='Running…';try{const body={question:$('question').value,mode:$('mode').value,provider:$('provider').value};if($('evidence').value.trim())body.documents=[{id:'user-document',text:$('evidence').value}];const r=await fetch('/v1/agents/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();$('out').textContent=r.ok?`${data.answer}\n\nSources: ${data.sources.join(', ')||'None'}\nStatus: ${data.status}\n\n${data.steps.join('\n')}`:JSON.stringify(data,null,2)}catch(e){$('out').textContent='Request failed.'}finally{$('run').disabled=false}};</script></html>
